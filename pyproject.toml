[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reel2map"
version = "0.1.0"
description = "Turn TikTok / Instagram / YouTube recommendation videos into a map of real places: download, transcribe, OCR, extract with an LLM, geocode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maya Landman" }]
keywords = ["scraping", "yt-dlp", "whisper", "ocr", "llm", "geocoding", "google-maps", "tiktok", "instagram"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "yt-dlp[default,curl-cffi]>=2025.1.1",
  "anthropic>=0.40",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pillow>=10.0",
  "imageio-ffmpeg>=0.5",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
ocr = ["rapidocr-onnxruntime>=1.2"]
all = ["reel2map[transcribe,ocr]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
reel2map = "reel2map.cli:app"

[project.urls]
Homepage = "https://github.com/MayaLandman/reel-2-map"

[tool.hatch.build.targets.wheel]
packages = ["src/reel2map"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ffmpeg: needs the ffmpeg binary on PATH"]
